<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7f3eb">

  <title>Күнтізбе</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --bg: #f7f3eb;
      --card: #fffdf9;
      --text: #1d1d1b;
      --muted: #85827c;
      --gold: #b68a49;
      --gold-light: #eadbc3;
      --border: #e9e2d7;
      --white: #ffffff;
      --shadow: 0 8px 30px rgba(70, 55, 35, 0.06);
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      max-width: 520px;
      margin: auto;
      min-height: 100vh;
      padding-bottom: 105px;
    }

    .header {
      padding: 28px 20px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .logo {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: var(--gold);
      color: white;
      display: grid;
      place-items: center;
      font-size: 22px;
      font-weight: 700;
    }

    .brand-title {
      font-size: 19px;
      font-weight: 750;
    }

    .brand-small {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
    }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 0;
      background: var(--gold-light);
      color: #755a33;
      font-weight: 700;
    }

    main {
      padding: 0 18px;
    }

    .hello {
      margin: 14px 2px 22px;
    }

    .hello h1 {
      font-size: 30px;
      line-height: 1.1;
      margin: 0 0 7px;
    }

    .hello p {
      color: var(--muted);
      margin: 0;
      font-size: 15px;
    }

    .date-card {
      background: linear-gradient(135deg, #b68a49, #d2b17a);
      color: white;
      border-radius: 26px;
      padding: 22px;
      box-shadow: var(--shadow);
      margin-bottom: 18px;
    }

    .date-label {
      font-size: 13px;
      opacity: .85;
      margin-bottom: 7px;
    }

    .big-date {
      font-size: 25px;
      font-weight: 750;
      margin-bottom: 6px;
    }

    .date-sub {
      opacity: .9;
      font-size: 14px;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 25px;
    }

    .stat {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 17px;
      box-shadow: var(--shadow);
    }

    .stat-icon {
      font-size: 22px;
      margin-bottom: 12px;
    }

    .stat-number {
      font-size: 25px;
      font-weight: 750;
    }

    .stat-label {
      color: var(--muted);
      font-size: 13px;
      margin-top: 4px;
    }

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 25px 2px 13px;
    }

    .section-title h2 {
      font-size: 20px;
      margin: 0;
    }

    .section-title span {
      color: var(--gold);
      font-size: 13px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 23px;
      padding: 17px;
      box-shadow: var(--shadow);
    }

    .add-form {
      display: grid;
      gap: 10px;
    }

    .input {
      width: 100%;
      height: 52px;
      border: 1px solid var(--border);
      background: white;
      border-radius: 15px;
      padding: 0 15px;
      outline: none;
      font-size: 16px;
    }

    .input:focus {
      border-color: var(--gold);
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .primary {
      border: 0;
      height: 52px;
      border-radius: 15px;
      background: var(--gold);
      color: white;
      font-weight: 700;
      font-size: 16px;
    }

    .events {
      display: grid;
      gap: 10px;
    }

    .event {
      display: flex;
      gap: 13px;
      align-items: center;
      background: var(--card);
      border: 1px solid var(--border);
      padding: 14px;
      border-radius: 18px;
      box-shadow: var(--shadow);
    }

    .event-time {
      min-width: 64px;
      color: var(--gold);
      font-weight: 750;
      font-size: 15px;
    }

    .event-info {
      flex: 1;
      min-width: 0;
    }

    .event-name {
      font-weight: 700;
      margin-bottom: 4px;
      word-break: break-word;
    }

    .event-date {
      color: var(--muted);
      font-size: 13px;
    }

    .delete {
      border: 0;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #f4eee5;
      color: #8a7761;
      font-size: 17px;
    }

    .empty {
      color: var(--muted);
      text-align: center;
      padding: 25px 10px;
      font-size: 14px;
    }

    .calendar-box {
      margin-top: 10px;
    }

    .calendar-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 17px;
    }

    .calendar-head button {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: white;
      font-size: 20px;
    }

    #monthTitle {
      font-weight: 750;
    }

    .week,
    .days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
    }

    .week div {
      font-size: 11px;
      color: var(--muted);
      padding-bottom: 10px;
    }

    .day {
      min-height: 43px;
      display: grid;
      place-items: center;
      font-size: 14px;
      border-radius: 12px;
      position: relative;
    }

    .day.today {
      background: var(--gold);
      color: white;
      font-weight: 700;
    }

    .day.has-event::after {
      content: "";
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--gold);
      position: absolute;
      bottom: 3px;
    }

    .day.today.has-event::after {
      background: white;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: min(520px, 100%);
      height: 82px;
      background: rgba(255, 253, 249, .96);
      backdrop-filter: blur(18px);
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      padding: 8px 12px 18px;
      z-index: 10;
    }

    .nav-btn {
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: 11px;
      display: grid;
      place-items: center;
      gap: 2px;
    }

    .nav-icon {
      font-size: 21px;
    }

    .nav-btn.active {
      color: var(--gold);
      font-weight: 700;
    }

    .page {
      display: none;
    }

    .page.active {
      display: block;
    }

    @media (min-width: 700px) {
      .app {
        max-width: 900px;
      }

      .bottom-nav {
        max-width: 900px;
      }

      .stats {
        grid-template-columns: repeat(4, 1fr);
      }
    }
  </style>
</head>

<body>

<div class="app">

  <header class="header">
    <div class="brand">
      <div class="logo">AE</div>
      <div>
        <div class="brand-title">Күнтізбе</div>
        <div class="brand-small">ALEM EVENT</div>
      </div>
    </div>

    <button class="avatar">AE</button>
  </header>

  <main>

    <section id="homePage" class="page active">

      <div class="hello">
        <h1>Қайырлы күн!</h1>
        <p>Кездесулер мен жұмыстарды бір жерден басқарыңыз</p>
      </div>

      <div class="date-card">
        <div class="date-label">БҮГІН</div>
        <div class="big-date" id="todayText"></div>
        <div class="date-sub" id="todayWeek"></div>
      </div>

      <div class="stats">
        <div class="stat">
          <div class="stat-icon">✓</div>
          <div class="stat-number" id="todayCount">0</div>
          <div class="stat-label">Бүгінгі жоспар</div>
        </div>

        <div class="stat">
          <div class="stat-icon">📅</div>
          <div class="stat-number" id="allCount">0</div>
          <div class="stat-label">Барлық жоспар</div>
        </div>
      </div>

      <div class="section-title">
        <h2>Жаңа жоспар</h2>
      </div>

      <div class="card">
        <div class="add-form">

          <input
            class="input"
            id="eventName"
            placeholder="Кездесу немесе жұмыс атауы"
          >

          <div class="row">
            <input class="input" id="eventDate" type="date">
            <input class="input" id="eventTime" type="time">
          </div>

          <button class="primary" onclick="addEvent()">
            + Жоспар қосу
          </button>

        </div>
      </div>

      <div class="section-title">
        <h2>Жақын жоспарлар</h2>
        <span id="eventTotal"></span>
      </div>

      <div id="eventList" class="events"></div>

    </section>


    <section id="calendarPage" class="page">

      <div class="hello">
        <h1>Күнтізбе</h1>
        <p>Барлық кездесулер мен жұмыстар</p>
      </div>

      <div class="card calendar-box">

        <div class="calendar-head">
          <button onclick="changeMonth(-1)">‹</button>
          <div id="monthTitle"></div>
          <button onclick="changeMonth(1)">›</button>
        </div>

        <div class="week">
          <div>ДС</div>
          <div>СС</div>
          <div>СР</div>
          <div>БС</div>
          <div>ЖМ</div>
          <div>СБ</div>
          <div>ЖС</div>
        </div>

        <div class="days" id="calendarDays"></div>

      </div>

    </section>


    <section id="plansPage" class="page">

      <div class="hello">
        <h1>Жоспарлар</h1>
        <p>Барлық қосылған жоспарлар</p>
      </div>

      <div id="allEventList" class="events"></div>

    </section>

  </main>

</div>


<nav class="bottom-nav">

  <button class="nav-btn active" onclick="openPage('homePage', this)">
    <span class="nav-icon">⌂</span>
    <span>Басты бет</span>
  </button>

  <button class="nav-btn" onclick="openPage('calendarPage', this)">
    <span class="nav-icon">□</span>
    <span>Күнтізбе</span>
  </button>

  <button class="nav-btn" onclick="openPage('plansPage', this)">
    <span class="nav-icon">☷</span>
    <span>Жоспарлар</span>
  </button>

</nav>


<script>

  let events = JSON.parse(localStorage.getItem("alemCalendarEvents")) || [];

  let calendarDate = new Date();

  const months = [
    "Қаңтар",
    "Ақпан",
    "Наурыз",
    "Сәуір",
    "Мамыр",
    "Маусым",
    "Шілде",
    "Тамыз",
    "Қыркүйек",
    "Қазан",
    "Қараша",
    "Желтоқсан"
  ];

  const weekDays = [
    "Жексенбі",
    "Дүйсенбі",
    "Сейсенбі",
    "Сәрсенбі",
    "Бейсенбі",
    "Жұма",
    "Сенбі"
  ];


  function formatLocalDate(date) {
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, "0");
    const d = String(date.getDate()).padStart(2, "0");

    return `${y}-${m}-${d}`;
  }


  function init() {

    const today = new Date();

    document.getElementById("todayText").textContent =
      `${today.getDate()} ${months[today.getMonth()]} ${today.getFullYear()}`;

    document.getElementById("todayWeek").textContent =
      weekDays[today.getDay()];

    document.getElementById("eventDate").value =
      formatLocalDate(today);

    renderEvents();
    renderCalendar();
  }


  function addEvent() {

    const name =
      document.getElementById("eventName").value.trim();

    const date =
      document.getElementById("eventDate").value;

    const time =
      document.getElementById("eventTime").value;

    if (!name) {
      alert("Жоспар атауын жазыңыз");
      return;
    }

    if (!date) {
      alert("Күнін таңдаңыз");
      return;
    }

    events.push({
      id: Date.now(),
      name,
      date,
      time
    });

    events.sort((a, b) => {
      return (a.date + a.time).localeCompare(b.date + b.time);
    });

    saveEvents();

    document.getElementById("eventName").value = "";
    document.getElementById("eventTime").value = "";

    renderEvents();
    renderCalendar();
  }


  function deleteEvent(id) {

    if (!confirm("Осы жоспарды өшірейін бе?")) {
      return;
    }

    events = events.filter(event => event.id !== id);

    saveEvents();
    renderEvents();
    renderCalendar();
  }


  function saveEvents() {
    localStorage.setItem(
      "alemCalendarEvents",
      JSON.stringify(events)
    );
  }


  function eventHTML(event) {

    const safeName = escapeHTML(event.name);

    return `
      <div class="event">

        <div class="event-time">
          ${event.time || "—"}
        </div>

        <div class="event-info">

          <div class="event-name">
            ${safeName}
          </div>

          <div class="event-date">
            ${formatDisplayDate(event.date)}
          </div>

        </div>

        <button
          class="delete"
          onclick="deleteEvent(${event.id})"
        >
          ×
        </button>

      </div>
    `;
  }


  function renderEvents() {

    const list =
      document.getElementById("eventList");

    const allList =
      document.getElementById("allEventList");

    const today =
      formatLocalDate(new Date());

    const futureEvents =
      events.filter(event => event.date >= today);

    document.getElementById("todayCount").textContent =
      events.filter(event => event.date === today).length;

    document.getElementById("allCount").textContent =
      events.length;

    document.getElementById("eventTotal").textContent =
      `${events.length} жоспар`;


    if (futureEvents.length === 0) {

      list.innerHTML =
        `<div class="card empty">
          Әзірге жоспар жоқ
        </div>`;

    } else {

      list.innerHTML =
        futureEvents
          .slice(0, 6)
          .map(eventHTML)
          .join("");

    }


    if (events.length === 0) {

      allList.innerHTML =
        `<div class="card empty">
          Әзірге жоспар жоқ
        </div>`;

    } else {

      allList.innerHTML =
        events
          .map(eventHTML)
          .join("");

    }
  }


  function renderCalendar() {

    const year =
      calendarDate.getFullYear();

    const month =
      calendarDate.getMonth();

    document.getElementById("monthTitle").textContent =
      `${months[month]} ${year}`;

    const firstDay =
      new Date(year, month, 1);

    const lastDay =
      new Date(year, month + 1, 0);

    let start =
      firstDay.getDay();

    start =
      start === 0 ? 6 : start - 1;

    let html = "";

    for (let i = 0; i < start; i++) {
      html += `<div class="day"></div>`;
    }

    const today =
      formatLocalDate(new Date());

    for (let day = 1; day <= lastDay.getDate(); day++) {

      const date =
        `${year}-${String(month + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;

      const isToday =
        date === today;

      const hasEvent =
        events.some(event => event.date === date);

      html += `
        <div class="day
          ${isToday ? "today" : ""}
          ${hasEvent ? "has-event" : ""}
        ">
          ${day}
        </div>
      `;
    }

    document.getElementById("calendarDays").innerHTML =
      html;
  }


  function changeMonth(amount) {

    calendarDate.setMonth(
      calendarDate.getMonth() + amount
    );

    renderCalendar();
  }


  function openPage(pageId, button) {

    document
      .querySelectorAll(".page")
      .forEach(page => {
        page.classList.remove("active");
      });

    document
      .getElementById(pageId)
      .classList.add("active");

    document
      .querySelectorAll(".nav-btn")
      .forEach(btn => {
        btn.classList.remove("active");
      });

    button.classList.add("active");

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });
  }


  function formatDisplayDate(dateString) {

    const parts =
      dateString.split("-");

    return `${Number(parts[2])} ${months[Number(parts[1]) - 1]} ${parts[0]}`;
  }


  function escapeHTML(text) {

    const div =
      document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
  }


  init();

</script>

</body>
</html>
